name: Release

# Tag 推送触发：从 CHANGELOG.md（中文版）与 CHANGELOG_EN.md（英文版）提取该版本段落，
# 拼成中英双语正文并创建 GitHub Release。typecheck/测试/web 构建由 ci.yml 在同一 tag 上跑。
# 本地流程见 .claude/skills/release/SKILL.md（两份 CHANGELOG 与版本号在推送 tag 前已就位）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bilingual release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          extract() {
            awk -v ver="## [${VERSION}]" '
              index($0, ver) == 1 { in_section = 1 }
              in_section && /^## \[/ && index($0, ver) != 1 { exit }
              in_section { print }
            ' "$1"
          }
          {
            echo "## 🇨🇳 中文"
            extract CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "## 🇬🇧 English"
            extract CHANGELOG_EN.md
          } | sed '/<!-- AI_SUMMARY -->/d' > RELEASE_BODY.md
          head -c 400 RELEASE_BODY.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
