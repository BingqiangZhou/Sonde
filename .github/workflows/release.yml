name: Release

# Tag 推送触发：验证构建/测试，用 git-cliff 生成该版本说明并创建 GitHub Release。
# 本地流程见 .zcode/skills/release/SKILL.md（CHANGELOG.md 与版本号在推送 tag 前已就位）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff 需要完整历史与相邻 tag
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Strip AI summary placeholder
        run: sed -i '/<!-- AI_SUMMARY -->/d' CHANGES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
