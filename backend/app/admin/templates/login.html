{% extends "base.html" %}

{% block title %}登录{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 -mt-16">
        <div>
            <h2 class="text-center text-3xl font-extrabold text-gray-900">
                管理后台登录
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                声读
            </p>
        </div>
        <form class="mt-8 space-y-6" action="/api/v1/admin/login" method="POST">
            <!-- Error Messages -->
            {% if messages %}
                {% for message in messages %}
                <div class="rounded-md bg-{{ message.type }}-50 p-4 mb-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            {% if message.type == 'error' %}
                            <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                            </svg>
                            {% elif message.type == 'success' %}
                            <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                            </svg>
                            {% endif %}
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-medium text-{{ message.type }}-800">
                                {{ message.text }}
                            </p>
                        </div>
                    </div>
                </div>
                {% endfor %}
            {% endif %}

            <div class="rounded-md shadow-sm">
                <div>
                    <label for="api_key" class="sr-only">API Key</label>
                    <input id="api_key" name="api_key" type="password" required autofocus
                           class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                           placeholder="API Key（backend/.env 中的 API_KEY）">
                </div>
            </div>

            <div>
                <button type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    登录
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
