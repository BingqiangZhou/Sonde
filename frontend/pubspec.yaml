name: sonde
description: Sonde - personal podcast insight app.

publish_to: 'none'

version: 0.52.0+114

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1
  # Navigation
  go_router: ^17.1.0

  # HTTP Client
  dio: ^5.9.2

  retrofit: ^4.9.2
  json_annotation: ^4.11.0

  # Local Storage
  shared_preferences: ^2.5.4

  # Local Database
  drift: ^2.31.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI Components
  shimmer: ^3.0.0
  flutter_markdown_plus: ^1.0.7
  flutter_widget_from_html: ^0.17.1
  html: ^0.15.6
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.4.1
  table_calendar: ^3.2.0

  # Utilities
  intl: ^0.20.2

  # Security
  flutter_secure_storage: ^11.0.0

  # Audio Player
  audioplayers: ^6.6.0
  audio_service: ^0.18.18
  permission_handler: ^13.0.1

  # Desktop Info
  package_info_plus: ^10.2.1

  # Logging
  equatable: ^2.0.8
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

  # Build Tools
  share_plus: ^13.3.0
  flutter_native_splash: ^2.4.7

  dio_cache_interceptor: ^4.0.6

  clock: any
  cupertino_ui: ^1.0.0
  material_ui: ^1.0.0
  app_links: ^7.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.12.2
  retrofit_generator: ^10.2.1
  json_serializable: ^6.13.0
  drift_dev: ^2.20.3

  # Linting & Testing
  very_good_analysis: ^10.2.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

  # Build Tools
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/Logo3.png

# flutter_launcher_icons configuration
flutter_launcher_icons:
  image_path: "assets/icons/Logo3.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/Logo3.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/Logo3.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/Logo3.png"
