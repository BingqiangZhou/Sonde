org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
# KGP 2.3.20 on this machine: daemon crashes (JBR 21) and incremental cache persistence
# fails ("Could not close incremental caches"), so compile in-process and non-incrementally
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 8.13 is only tested up to compileSdk 36; flutter plugins require 37 (backward compatible)
android.suppressUnsupportedCompileSdk=37
