# =============================================================================
# Sonde (声读) — Docker Compose
# =============================================================================
# 使用方法 / Usage:
#   1. 复制 .env.example .env / Copy .env.example to .env
#   2. 按需修改 .env 配置 / Modify .env as needed
#   3. 启动服务 / Start services: docker compose up -d --build
#
# Compose project name is pinned to "sonde" (top-level `name:`), so images,
# volumes and the network are always sonde-* regardless of the directory name.
#
# 启动的服务 / Started services (4):
#   - PostgreSQL (数据 + 任务队列 / Database & job queue)
#   - Backend API (后端服务, 独占执行迁移 / owns schema migrations)
#   - Worker (procrastinate 队列 worker + 周期调度 / queue worker + cron)
#   - Caddy (反向代理 + TLS / Reverse proxy & TLS)

name: sonde

# Shared logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Shared build definition for the backend-derived images
x-app-build: &app-build
  build:
    context: ${BACKEND_SRC_DIR:-../backend}
    dockerfile: Dockerfile

# Shared environment for all backend-derived services (API/worker)
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sonde}
  TZ: ${TZ:-Asia/Shanghai}
  PYTHONUTF8: 1

services:
  # =============================================================================
  # PostgreSQL Database (data + procrastinate job queue)
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: sonde-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sonde}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: postgres -c max_connections=100 -c shared_buffers=128MB -c effective_cache_size=256MB
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-sonde}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================================
  # Backend API (owns alembic migrations + queue schema via RUN_MIGRATIONS=1)
  # =============================================================================
  backend:
    <<: *app-build
    container_name: sonde-backend
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      <<: *app-env
      # Only this container runs alembic migrations (avoids concurrent-upgrade races)
      RUN_MIGRATIONS: "1"
    ports:
      - "${BACKEND_PUBLISH_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
      - ${TRANSCRIPTION_STORAGE_DIR:-./storage/podcasts}:/app/storage/podcasts
      - ${TRANSCRIPTION_TEMP_DIR:-./temp/transcription}:/app/temp/transcription
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Unified: uvicorn for both local and cloud (local can add --reload via BACKEND_CMD)
    command: ${BACKEND_CMD:-uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 60 --proxy-headers --forwarded-allow-ips=*}
    logging: *default-logging

  # =============================================================================
  # Queue Worker (procrastinate: job execution + periodic cron deferral)
  # =============================================================================
  worker:
    <<: *app-build
    container_name: sonde-worker
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      <<: *app-env
      # Cron expressions are evaluated in the process-local timezone; pin UTC
      # to keep parity with the former Celery beat schedules (19:30 UTC etc.)
      TZ: UTC
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - backend_data:/app/data
      - ${TRANSCRIPTION_STORAGE_DIR:-./storage/podcasts}:/app/storage/podcasts
      - ${TRANSCRIPTION_TEMP_DIR:-./temp/transcription}:/app/temp/transcription
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      # Migrations are owned by backend; wait for its health so the schema is settled
      backend:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    command: python -m app.bootstrap.worker
    healthcheck:
      test: ["CMD", "python", "-m", "app.bootstrap.worker", "--healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    logging: *default-logging

  # =============================================================================
  # Caddy Reverse Proxy (反向代理 + TLS)
  # =============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: sonde-caddy
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDY_CONF_DIR:-./caddy}/Caddyfile:/etc/caddy/Caddyfile:ro
      # /data persists the internal CA (and ACME account/certs when enabled)
      - caddy_data:/data
      - caddy_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - MAX_BODY_SIZE=${MAX_BODY_SIZE:-20MB}
    depends_on:
      - backend
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    name: sonde_postgres_data
  backend_uploads:
    name: sonde_uploads
  backend_data:
    name: sonde_data
  caddy_data:
    name: sonde_caddy_data
  caddy_config:
    name: sonde_caddy_config

networks:
  app_network:
    name: sonde_network
