# =============================================================================
# Sonde (声读) — Docker Compose
# =============================================================================
# 使用方法 / Usage:
#   1. 复制 .env.example .env / Copy .env.example to .env
#   2. 按需修改 .env 配置 / Modify .env as needed
#   3. 启动服务 / Start services: docker compose up -d --build
#
# Compose project name is pinned to "sonde" (top-level `name:`), so images,
# volumes and the network are always sonde-* regardless of the directory name.
#
# 启动的服务 / Started services (7):
#   - PostgreSQL (数据 / Database)
#   - Redis (缓存与锁 / Cache & locks)
#   - Backend API (后端服务, 独占执行迁移 / owns schema migrations)
#   - Celery Worker (后台任务 / Background tasks)
#   - Celery Beat (调度器, 独立单实例 / standalone scheduler)
#   - Postgres Backup (每日 pg_dump 侧车 / daily backup sidecar)
#   - Nginx (反向代理 / Reverse proxy)

name: sonde

# Shared logging configuration for all services
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Shared build definition for the backend-derived images
x-app-build: &app-build
  build:
    context: ${BACKEND_SRC_DIR:-../backend}
    dockerfile: Dockerfile

# Shared environment for all backend-derived services (API/worker/beat)
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sonde}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  TZ: ${TZ:-Asia/Shanghai}
  PYTHONUTF8: 1

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: sonde-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sonde}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: postgres -c max_connections=100 -c shared_buffers=128MB -c effective_cache_size=256MB
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-sonde}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================================
  # Redis Cache
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: sonde-redis
    command: >
      sh -c 'if [ -z "$REDIS_PASSWORD" ]; then
               redis-server --appendonly yes --maxmemory 230mb --maxmemory-policy allkeys-lru;
             else
               redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --maxmemory 230mb --maxmemory-policy allkeys-lru;
             fi'
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: >
        sh -c 'if [ -z "$REDIS_PASSWORD" ]; then
                 redis-cli ping;
               else
                 redis-cli -a "$REDIS_PASSWORD" ping;
               fi'
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # =============================================================================
  # Backend API (owns alembic migrations via RUN_MIGRATIONS=1)
  # =============================================================================
  backend:
    <<: *app-build
    container_name: sonde-backend
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      <<: *app-env
      # Only this container runs alembic migrations (avoids concurrent-upgrade races)
      RUN_MIGRATIONS: "1"
    ports:
      - "${BACKEND_PUBLISH_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
      - ${TRANSCRIPTION_STORAGE_DIR:-./storage/podcasts}:/app/storage/podcasts
      - ${TRANSCRIPTION_TEMP_DIR:-./temp/transcription}:/app/temp/transcription
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Unified: uvicorn for both local and cloud (local can add --reload via BACKEND_CMD)
    command: ${BACKEND_CMD:-uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 60 --proxy-headers --forwarded-allow-ips=*}
    logging: *default-logging

  # =============================================================================
  # Celery Worker (background task execution; beat split out below)
  # =============================================================================
  worker:
    <<: *app-build
    container_name: sonde-worker
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      <<: *app-env
    volumes:
      - backend_data:/app/data
      - ${TRANSCRIPTION_STORAGE_DIR:-./storage/podcasts}:/app/storage/podcasts
      - ${TRANSCRIPTION_TEMP_DIR:-./temp/transcription}:/app/temp/transcription
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations are owned by backend; wait for its health so the schema is settled
      backend:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    command: celery -A app.core.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} --concurrency=1 -Q default
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    logging: *default-logging

  # =============================================================================
  # Celery Beat (standalone scheduler — single instance, safe to scale worker)
  # =============================================================================
  beat:
    <<: *app-build
    container_name: sonde-beat
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      <<: *app-env
    volumes:
      - backend_data:/app/data
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M
    command: celery -A app.core.celery_app:celery_app beat --loglevel=${CELERY_LOG_LEVEL:-info}
    logging: *default-logging

  # =============================================================================
  # Postgres Backup (daily pg_dump sidecar with retention)
  # =============================================================================
  backup:
    image: postgres:15-alpine
    container_name: sonde-backup
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sonde}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "=== Sonde postgres backup sidecar: daily pg_dump, retention $${BACKUP_RETENTION_DAYS:-7}d ==="
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          echo "[backup] dumping $${POSTGRES_DB} to /backups/db_$${ts}.dump"
          pg_dump -h postgres -U "$${POSTGRES_USER:-admin}" -Fc -f "/backups/db_$${ts}.dump" "$${POSTGRES_DB}" \
            || echo "[backup] pg_dump FAILED (will retry next cycle)"
          find /backups -name 'db_*.dump' -mtime +"$${BACKUP_RETENTION_DAYS:-7}" -delete 2>/dev/null || true
          sleep 86400
        done
    logging: *default-logging

  # =============================================================================
  # Nginx Reverse Proxy (反向代理)
  # =============================================================================
  nginx:
    image: nginx:stable-alpine
    container_name: sonde-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF_DIR:-./nginx}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_CONF_DIR:-./nginx}/conf.d:/etc/nginx/templates:rw
      - ${NGINX_CERT_DIR:-./nginx/cert}:/etc/nginx/cert:ro
      - ${NGINX_LOG_DIR:-./nginx/logs}:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
      - ${NGINX_CONF_DIR:-./nginx}/docker-entrypoint.sh:/auto-config.sh:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/cert/fullchain.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/cert/privkey.pem}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /auto-config.sh ]; then
          echo "=== Running auto-configuration ==="
          sh /auto-config.sh || echo "Warning: auto-config script failed, continuing..."
        fi
        echo "=== Starting Nginx ==="
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      - backend
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    name: sonde_postgres_data
  redis_data:
    name: sonde_redis_data
  backend_uploads:
    name: sonde_uploads
  backend_data:
    name: sonde_data

networks:
  app_network:
    name: sonde_network
